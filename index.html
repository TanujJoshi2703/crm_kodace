<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Simple redirect logic based on localStorage
        const user = localStorage.getItem('kodace_user');
        if (user) {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'login.html';
        }
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
